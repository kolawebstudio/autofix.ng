<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoFix NG | Admin Dashboard</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        background: #111827;
        color: #fff;
        padding: 25px;
      }

      .container {
        max-width: 1100px;
        margin: auto;
      }

      h1 {
        color: #f97316;
        margin-bottom: 10px;
      }

      .subtitle {
        color: #9ca3af;
        margin-bottom: 30px;
      }

      .panel {
        background: #1f2937;
        padding: 25px;
        border-radius: 12px;
        margin-bottom: 20px;
      }

      input,
      button {
        padding: 12px;
        border-radius: 6px;
        border: none;
        font-size: 15px;
      }

      input {
        width: 100%;
        margin: 10px 0;
        background: #374151;
        color: white;
      }

      button {
        background: #f97316;
        color: white;
        cursor: pointer;
        font-weight: bold;
      }

      button:hover {
        opacity: 0.85;
      }

      .hidden {
        display: none;
      }

      .booking {
        background: #374151;
        padding: 18px;
        border-radius: 8px;
        margin-top: 15px;
      }

      .booking p {
        margin: 8px 0;
        color: #d1d5db;
      }

      select {
        padding: 10px;
        border-radius: 6px;
        margin-top: 10px;
      }

      #message {
        margin-top: 15px;
        color: #fbbf24;
      }

      @media (max-width: 600px) {
        body {
          padding: 15px;
        }

        .panel {
          padding: 18px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>AutoFix NG</h1>
      <p class="subtitle">Admin Dashboard</p>

      <div class="panel" id="loginPanel">
        <h2>Admin Login</h2>

        <input type="email" id="email" placeholder="Admin email" />

        <input type="password" id="password" placeholder="Password" />

        <button id="loginBtn">Login</button>

        <p id="loginMessage"></p>
      </div>

      <div id="dashboard" class="hidden">
        <div class="panel">
          <h2>Booking Management</h2>
          <p>View and manage customer service requests.</p>

          <button id="refreshBtn">Refresh Bookings</button>
          <button id="logoutBtn">Logout</button>

          <p id="message"></p>
        </div>

        <div id="bookingList"></div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = "https://dlctsrzzrqcdipmzpqzz.supabase.co";
      const SUPABASE_KEY = "sb_publishable_dRRo8MohkduP1Bda5wIvtA_57xoX1e5";

      const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
      );

      const loginPanel = document.getElementById("loginPanel");
      const dashboard = document.getElementById("dashboard");
      const loginMessage = document.getElementById("loginMessage");
      const bookingList = document.getElementById("bookingList");
      const message = document.getElementById("message");

      // Admin login
      document
        .getElementById("loginBtn")
        .addEventListener("click", async () => {
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;

          loginMessage.textContent = "Logging in...";

          const { error } = await supabaseClient.auth.signInWithPassword({
            email,
            password,
          });

          if (error) {
            loginMessage.textContent = error.message;
            return;
          }

          showDashboard();
        });

      // Show dashboard
      async function showDashboard() {
        loginPanel.classList.add("hidden");
        dashboard.classList.remove("hidden");
        await loadBookings();
      }

      // Load customer bookings
      async function loadBookings() {
        message.textContent = "Loading bookings...";
        bookingList.innerHTML = "";

        const { data, error } = await supabaseClient
          .from("bookings")
          .select("*")
          .order("created_at", { ascending: false });

        if (error) {
          message.textContent = error.message;
          return;
        }

        message.textContent = data.length
          ? `${data.length} booking(s) found.`
          : "No bookings yet.";

        data.forEach((booking) => {
          const card = document.createElement("div");
          card.className = "booking";

          const details = document.createElement("div");

          [
            `Name: ${booking.full_name}`,
            `Phone: ${booking.phone}`,
            `Vehicle: ${booking.vehicle_model}`,
            `Service: ${booking.service}`,
            `Details: ${booking.message || "None"}`,
            `Status: ${booking.status}`,
          ].forEach((text) => {
            const p = document.createElement("p");
            p.textContent = text;
            details.appendChild(p);
          });

          const status = document.createElement("select");

          [
            "pending",
            "confirmed",
            "in progress",
            "completed",
            "cancelled",
          ].forEach((value) => {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = value;
            option.selected = booking.status === value;
            status.appendChild(option);
          });

          status.addEventListener("change", async () => {
            const { error } = await supabaseClient
              .from("bookings")
              .update({ status: status.value })
              .eq("id", booking.id);

            if (error) {
              alert("Status update failed: " + error.message);
              return;
            }

            alert("Booking status updated!");
            loadBookings();
          });

          card.appendChild(details);
          card.appendChild(status);
          bookingList.appendChild(card);
        });
      }

      // Refresh bookings
      document
        .getElementById("refreshBtn")
        .addEventListener("click", loadBookings);

      // Logout
      document
        .getElementById("logoutBtn")
        .addEventListener("click", async () => {
          await supabaseClient.auth.signOut();
          dashboard.classList.add("hidden");
          loginPanel.classList.remove("hidden");
          loginMessage.textContent = "";
        });

      // Restore existing login session
      supabaseClient.auth.getSession().then(({ data }) => {
        if (data.session) {
          showDashboard();
        }
      });
    </script>
  </body>
</html>
